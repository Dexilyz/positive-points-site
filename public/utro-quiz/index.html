function q(id, category, difficulty, text, correct, distractors, explanation) {
  const c=String(correct);
  const d=unique((distractors||[]).map(String).filter(x=>x!==c));
  const numeric=Number(c.replace('%',''));
  if(Number.isFinite(numeric)){
    const suffix=c.endsWith('%')?'%':'';
    for(const delta of [1,2,5,10,-1,-2,-5,-10,20]){
      const v=numeric+delta;if(v<0)continue;const candidate=`${v}${suffix}`;if(candidate!==c&&!d.includes(candidate))d.push(candidate);if(d.length>=3)break;
    }
  }
  const fillers=['Другой вариант','Нельзя определить','Ни один из этих'];
  for(const f of fillers){if(d.length>=3)break;if(f!==c&&!d.includes(f))d.push(f);}
  return {id, category, difficulty, text, correct:c, distractors:d.slice(0,3), explanation};
}

function unique(arr){ return [...new Set(arr)]; }
function pickDistractors(source, correct, count=3){
  return unique(source.filter(x=>x!==correct)).slice(0,count);
}
function numOptions(correct, values){
  const opts=unique(values.map(v=>String(v)).filter(v=>v!==String(correct)));
  let delta=1;
  while(opts.length<3){ opts.push(String(Number(correct)+delta)); delta++; }
  return opts.slice(0,3);
}

function generatedGeography(){
  const out=[];
  const caps=countries.map(c=>c[1]), names=countries.map(c=>c[0]);
  countries.forEach(([country,capital,continent],i)=>{
    const same=countries.filter(c=>c[2]===continent && c[0]!==country);
    const diff=continent==='Европа'||continent==='Азия'?2:1;
    out.push(q(`geo-cap-${i}`,'География',diff,`Столица страны ${country}?`,capital,pickDistractors(same.map(c=>c[1]).concat(caps),capital),`${capital} — столица страны ${country}.`));
    out.push(q(`geo-country-${i}`,'География',Math.min(5,diff+1),`Столицей какой страны является ${capital}?`,country,pickDistractors(same.map(c=>c[0]).concat(names),country),`${capital} — столица страны ${country}.`));
    out.push(q(`geo-cont-${i}`,'География',continent==='Европа'?1:2,`В какой части света находится ${country}?`,continent,pickDistractors(['Европа','Азия','Африка','Северная Америка','Южная Америка','Океания'],continent),`${country} относится к региону «${continent}».`));

}

async function loadBase(){ return []; }

async function buildQuestionBank(){
  const base=await loadBase();
  const all=[...base,...generatedGeography(),...generatedEnglish(),...generatedScience(),...generatedHistory(),...generatedMath(),...generatedGeneral()];
  const seen=new Set();
  return all.filter(item=>{
    const key=item.category+'|'+item.text+'|'+item.correct;
    if(seen.has(key)) return false;
    seen.add(key); return true;
  });
}

function freshStats(age){
  const base=baseLevel(age);
  return {history:{},sessions:{},seen:[],skills:Object.fromEntries(CATEGORIES.map(c=>[c,base])),topic:'Всё',challenge:'normal'};
}
function baseLevel(age){ if(age<=9)return 1.35;if(age<=11)return 2;if(age<=14)return 2.8;if(age<=17)return 3.35;return 4; }
function profileRange(age){ if(age<=9)return [1,2.65];if(age<=11)return [1,3.3];if(age<=14)return [1.5,4.2];if(age<=17)return [2,4.7];return [2.5,5]; }
function loadState(){
  const base={activeProfile:'elisey',profiles:structuredClone(PROFILE_DEFAULTS),stats:{}};
  for(const [id,p] of Object.entries(base.profiles)) base.stats[id]=freshStats(p.age);
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(saved?.profiles&&saved?.stats){
      base.activeProfile=PROFILE_DEFAULTS[saved.activeProfile]?saved.activeProfile:'elisey';
      for(const id of Object.keys(PROFILE_DEFAULTS)){
        base.profiles[id]={...PROFILE_DEFAULTS[id],...(saved.profiles[id]||{})};
        base.stats[id]={...freshStats(base.profiles[id].age),...(saved.stats[id]||{})};
        base.stats[id].skills={...freshStats(base.profiles[id].age).skills,...(saved.stats[id]?.skills||{})};
        base.stats[id].seen=Array.isArray(base.stats[id].seen)?base.stats[id].seen.slice(-180):[];
      }
    }
  }catch{}
  return base;
}
function save(){ try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{} }
function seeded(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r=Math.random){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function greeting(){const h=new Date().getHours();return h<11?'Доброе утро':h<17?'Добрый день':'Привет';}
function niceDate(){return new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());}
function streak(stats){let d=dayNumber(todayKey()),n=0;const set=new Set(Object.keys(stats.history).map(dayNumber));if(!set.has(d))d--;while(set.has(d)){n++;d--;}return n;}
function best(stats){const vals=Object.values(stats.history);return vals.length?Math.max(...vals):0;}
function average(stats){const vals=Object.values(stats.history);return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'—';}
function categoryAllowed(cat){const age=profile().age;if(cat==='Философия')return age>=13;return true;}
function mixCategories(){return CATEGORIES.filter(categoryAllowed);}
function currentTarget(cat){
  const p=profile(), s=pstats(), [lo,hi]=profileRange(p.age);
  const skill=Number(s.skills[cat]??baseLevel(p.age));
  return clamp((skill*.72+baseLevel(p.age)*.28)+(CHALLENGES[s.challenge]?.offset||0),lo,hi);
}
function categoryPlan(r){
  const s=pstats();
  if(s.topic!=='Всё') return Array(10).fill(s.topic);
  const cats=mixCategories();
  const base=shuffle(cats,r);
  const out=[];while(out.length<10) out.push(...shuffle(base,r));
  return out.slice(0,10);
}
function makeSession(){
  const id=state.activeProfile, s=pstats(), date=todayKey();
  const key=`${date}|${s.topic}|${s.challenge}`;
  if(s.sessions[key]?.questions?.length===10)return s.sessions[key];
  const r=seeded(`utro-v3|${date}|${id}|${s.topic}|${s.challenge}`);
  const seen=new Set(s.seen||[]), used=new Set();
  const questions=categoryPlan(r).map(cat=>{
    const target=currentTarget(cat);
    let pool=bank.filter(q=>q.category===cat&&!used.has(q.id)&&!seen.has(q.id));
    if(pool.length<10) pool=bank.filter(q=>q.category===cat&&!used.has(q.id));
    const scored=pool.map(q=>({q,score:Math.abs(q.difficulty-target)+(r()*.58)})).sort((a,b)=>a.score-b.score);
    const src=scored[0]?.q || bank[Math.floor(r()*bank.length)];
    used.add(src.id);
    const options=shuffle([src.correct,...src.distractors],r).slice(0,4);
    return {...src,options,correctIndex:options.indexOf(src.correct)};
  });
  const session={key,date,profile:id,topic:s.topic,challenge:s.challenge,index:0,answers:[],questions,finished:false,score:null,startedAt:Date.now()};
  s.sessions[key]=session;save();return session;
}
function updateSkill(q,correct){
  const s=pstats(), old=Number(s.skills[q.category]??baseLevel(profile().age));
  const diff=q.difficulty-old;
  const change=correct ? (.11 + Math.max(0,diff)*.055) : (-.12 - Math.max(0,-diff)*.035);
  const [lo,hi]=profileRange(profile().age);
  s.skills[q.category]=Number(clamp(old+change,lo,hi).toFixed(2));
}

      <article><span class="stat-icon">🏆</span><div><strong>${best(s) || '—'}</strong><span>лучший результат</span></div></article>
      <article><span class="stat-icon">◎</span><div><strong>${average(s)}</strong><span>средний балл</span></div></article>
      <article><span class="stat-icon">✦</span><div><strong>${bank.length.toLocaleString('ru-RU')}</strong><span>вопросов доступно</span></div></article>
    </section>

    <section class="content-grid">
      <article class="panel category-panel"><div class="panel-head"><div><span class="tiny-label">НАСТРОЙ НА СЕГОДНЯ</span><h2>Что потренируем?</h2></div><span class="smart-badge">адаптивно</span></div>
        <div class="category-grid"><button class="category-card ${s.topic==='Всё'?'active':''}" data-topic="Всё"><span class="mix-icon">✳</span><b>Всё вперемешку</b><small>лучший вариант на каждый день</small></button>${CATEGORIES.filter(categoryAllowed).map(cat=>`<button class="category-card ${s.topic===cat?'active':''}" data-topic="${esc(cat)}"><img src="${CATEGORY_META[cat].art}" alt=""><b>${esc(cat)}</b><small>уровень ${currentTarget(cat).toFixed(1)} / 5</small></button>`).join('')}</div>
      </article>
      <aside class="panel progress-panel"><div class="panel-head"><div><span class="tiny-label">ПОСЛЕДНИЕ 7 ДНЕЙ</span><h2>Твой ритм</h2></div></div><div class="week-chart">${hist.map(d=>`<div class="day-bar"><div class="bar-track"><i style="height:${d.score*10}%"></i></div><strong>${d.score||'·'}</strong><span>${d.day}</span></div>`).join('')}</div><p class="progress-note">Сложность меняется мягко: правильные ответы поднимают уровень, ошибки немного откатывают его назад.</p></aside>
    </section>
  </main>`);
  wireCommon();
  app.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{state.activeProfile=b.dataset.profile;save();renderHome();});
  app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{pstats().topic=b.dataset.topic;save();renderHome();});
  app.querySelector('[data-action="start"]').onclick=()=>{activeSession=makeSession();renderQuiz();};
}
function last7(s){const out=[];const fmt=new Intl.DateTimeFormat('ru-RU',{weekday:'short'});for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=todayKey(d);out.push({day:fmt.format(d).replace('.',''),score:s.history[key]||0});}return out;}
function renderQuiz(){
  view='quiz';const session=activeSession;if(!session){renderHome();return;}if(session.finished){renderResult();return;}
  const i=session.index,q=session.questions[i],answer=session.answers[i];
  selectedAnswer=Number.isInteger(answer)?answer:null;
  const answered=selectedAnswer!==null,correct=answered&&selectedAnswer===q.correctIndex;
  app.innerHTML=shell(`<main class="quiz-main"><div class="quiz-toolbar"><button class="back-link" data-action="home">← На главную</button><div class="quiz-person"><span>${esc(profile().letter)}</span>${esc(profile().name)}</div></div>
    <section class="quiz-card">
      <div class="quiz-progress-head"><div><span>${esc(q.category)}</span><b>${i+1} / 10</b></div><div class="progress-line">${session.questions.map((_,n)=>`<i class="${n<i?(session.answers[n]===session.questions[n].correctIndex?'ok':'bad'):n===i?'now':''}"></i>`).join('')}</div></div>
      <div class="question-layout"><div class="question-art"><img src="${CATEGORY_META[q.category]?.art||'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAgMTIwIj48cmVjdCB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgcng9IjI4IiBmaWxsPSIjZmZmNGM5Ii8+PHBhdGggZD0iTTYwIDIwYy0yMCAwLTM2IDE1LTM2IDM0IDAgMTQgOCAyNCAxOCAzMSA0IDMgNiA4IDYgMTJoMjRjMC00IDItOSA2LTEyIDEwLTcgMTgtMTcgMTgtMzEgMC0xOS0xNi0zNC0zNi0zNHoiIGZpbGw9IiNmZmQ4NWUiIHN0cm9rZT0iIzBkMjYzMyIgc3Ryb2tlLXdpZHRoPSI0Ii8+PHBhdGggZD0iTTQ5IDEwM2gyMk00OCA5NWgyNE02MCA0MnYyNU00OCA1NGgyNCIgc3Ryb2tlPSIjMGQyNjMzIiBzdHJva2Utd2lkdGg9IjQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjwvc3ZnPgo='}" alt=""><span>уровень ${q.difficulty}/5</span></div><div class="question-body"><h1>${esc(q.text)}</h1><div class="answers">${q.options.map((opt,n)=>`<button class="answer ${answered?(n===q.correctIndex?'correct':n===selectedAnswer?'wrong':'muted'):''}" data-answer="${n}" ${answered?'disabled':''}><span>${'ABCD'[n]}</span><b>${esc(opt)}</b>${answered&&n===q.correctIndex?'<i>✓</i>':answered&&n===selectedAnswer?'<i>×</i>':''}</button>`).join('')}</div>${answered?`<div class="feedback ${correct?'good':'oops'}"><strong>${correct?'Правильно':'Почти'}</strong><p>${correct?'':`Правильный ответ: <b>${esc(q.correct)}</b>. `}${esc(q.explanation)}</p></div><button class="continue-btn" data-action="next">${i===9?'Результат':'Дальше'} <span>→</span></button>`:'<p class="tap-note">Выбери один вариант. После ответа покажу короткое объяснение.</p>'}</div></div>
    </section></main>`);
  wireCommon();
  app.querySelector('[data-action="home"]').onclick=renderHome;
  app.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>answerQuestion(Number(btn.dataset.answer)));
  const next=app.querySelector('[data-action="next"]');if(next)next.onclick=nextQuestion;
}
function answerQuestion(n){
  const s=activeSession,q=s.questions[s.index];if(Number.isInteger(s.answers[s.index]))return;
  s.answers[s.index]=n;updateSkill(q,n===q.correctIndex);pstats().seen.push(q.id);pstats().seen=pstats().seen.slice(-180);save();
  if(n===q.correctIndex&&navigator.vibrate)navigator.vibrate(35);else if(navigator.vibrate)navigator.vibrate([25,35,25]);
  renderQuiz();
}
function nextQuestion(){
  const s=activeSession;if(s.index<9){s.index++;save();renderQuiz();scrollTo({top:0,behavior:'auto'});return;}
  s.finished=true;s.score=s.answers.filter((a,i)=>a===s.questions[i].correctIndex).length;s.finishedAt=Date.now();
  const hist=pstats().history;hist[s.date]=Math.max(hist[s.date]||0,s.score);save();renderResult();
}
function renderResult(){
  view='result';const s=activeSession,score=s.score??s.answers.filter((a,i)=>a===s.questions[i].correctIndex).length;
  const title=score===10?'Идеально. 10 из 10!':score>=8?'Очень сильное утро!':score>=6?'Хороший результат!':'Нормально — зато есть что запомнить.';
  app.innerHTML=shell(`<main class="result-main"><section class="result-card"><div class="result-orbit"><div class="score-ball"><strong>${score}</strong><span>из 10</span></div><span class="spark s1">✦</span><span class="spark s2">✳</span><span class="spark s3">✦</span></div><span class="tiny-label">КВИЗ ГОТОВ</span><h1>${title}</h1><p>${score>=8?'Сложность немного подрастёт там, где ты отвечаешь уверенно.':'Ошибки уже учтены — завтра подбор станет точнее.'}</p><div class="result-row">${s.questions.map((q,i)=>`<span class="${s.answers[i]===q.correctIndex?'ok':'bad'}">${s.answers[i]===q.correctIndex?'✓':'×'}</span>`).join('')}</div><div class="result-actions"><button class="start-btn" data-action="home">На главную</button><button class="secondary-btn" data-action="retry">Ещё 10 вопросов</button></div></section></main>`);
  wireCommon();
  app.querySelector('[data-action="home"]').onclick=renderHome;
  app.querySelector('[data-action="retry"]').onclick=()=>{const ss=pstats();const old=ss.sessions[activeSession.key];delete ss.sessions[activeSession.key];save();activeSession=makeSession();renderQuiz();if(old?.finished){} };
}
function settingsModal(){
  const p=profile(),s=pstats();
  const d=document.createElement('dialog');d.className='settings-modal';
  d.innerHTML=`<form method="dialog"><div class="dialog-head"><div><span class="tiny-label">НАСТРОЙКИ</span><h2>${esc(p.name)}</h2></div><button value="close" class="icon-btn">×</button></div><label>Возраст<input id="age-input" type="number" min="6" max="99" value="${p.age}"></label><label>Сложность<div class="challenge-row">${Object.entries(CHALLENGES).map(([id,x])=>`<button type="button" data-challenge="${id}" class="${s.challenge===id?'active':''}">${x.label}</button>`).join('')}</div></label><p class="setting-help">Возраст задаёт базовый уровень, а затем сайт подстраивается по твоим ответам. Для повседневного квиза лучше оставить «В самый раз».</p><button class="save-settings" value="save">Сохранить</button></form>`;
  document.body.appendChild(d);let chosen=s.challenge;
  d.querySelectorAll('[data-challenge]').forEach(b=>b.onclick=()=>{chosen=b.dataset.challenge;d.querySelectorAll('[data-challenge]').forEach(x=>x.classList.toggle('active',x===b));});
  d.addEventListener('close',()=>{if(d.returnValue==='save'){const age=clamp(Number(d.querySelector('#age-input').value)||p.age,6,99);p.age=age;s.challenge=chosen;for(const cat of CATEGORIES){const [lo,hi]=profileRange(age);s.skills[cat]=clamp(Number(s.skills[cat]??baseLevel(age)),lo,hi);}save();renderHome();}d.remove();});
  d.showModal();
}
function wireCommon(){
  app.querySelectorAll('[data-action="home"]').forEach(b=>{if(!b.onclick)b.onclick=renderHome;});
  app.querySelectorAll('[data-action="settings"]').forEach(b=>b.onclick=settingsModal);
  window.addEventListener('online',updateNetwork,{once:true});window.addEventListener('offline',updateNetwork,{once:true});
}
function updateNetwork(){const el=document.querySelector('#network-pill');if(el)el.innerHTML=`<i></i>${navigator.onLine?'онлайн':'офлайн'}`;}

async function init(){
  app.innerHTML=`<div class="loading"><div class="sun-loader">☀</div><strong>Собираю вопросы на утро…</strong></div>`;
  try{bank=await buildQuestionBank();bankById=new Map(bank.map(q=>[q.id,q]));renderHome();}
  catch(err){console.error(err);app.innerHTML=`<div class="loading"><strong>Не удалось загрузить банк вопросов.</strong><button onclick="location.reload()">Попробовать снова</button></div>`;}
  
}
init();
</script><script src="/utro-quiz/v4.js?v=4"></script></body></html>
